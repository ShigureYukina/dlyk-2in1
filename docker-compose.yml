# ============================================================
# DLyk CRM 依赖栈
#
#   docker compose up -d              # 启动全部依赖
#   docker compose ps                 # 查看状态
#   docker compose logs -f rabbitmq   # 查看某个组件日志
#
# 镜像前缀通过 .env 的 IMAGE_PREFIX 控制：
#   直连 Docker Hub 不通的环境可设为 docker.m.daocloud.io/
#
# 注意：容器名与数据卷名与 crm-api-autotest 的 README 保持一致，
#       从手写 docker run 迁移过来时数据不会丢（数据在命名卷里）。
# ============================================================

services:

  mysql:
    image: ${IMAGE_PREFIX:-}mysql:8.0
    container_name: dlyk-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1056398086}
      MYSQL_DATABASE: dlyk
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      # 慢查询日志：配合 docs/perf 的索引优化做持续观测
      - --slow_query_log=1
      - --long_query_time=0.2
      - --slow_query_log_file=/var/lib/mysql/slow.log
    volumes:
      - dlyk-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-1056398086}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    image: ${IMAGE_PREFIX:-}redis:7.2-alpine
    container_name: dlyk-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dlyk-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: ${IMAGE_PREFIX:-}rabbitmq:3.13-management-alpine
    container_name: dlyk-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP 协议端口
      - "15672:15672"  # 管理控制台 http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - dlyk-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # 反向代理：统一入口 + 限流 + 真实 IP 透传
  # 访问 http://localhost:8081/api/...
  nginx:
    image: ${IMAGE_PREFIX:-}nginx:1.27-alpine
    container_name: dlyk-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - dlyk-nginx-logs:/var/log/nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # XXL-Job 调度中心：承载原 @Scheduled 定时任务的调度、重试、分片与告警
  # 控制台 http://localhost:8080/xxl-job-admin (admin/123456)
  xxl-job-admin:
    image: ${IMAGE_PREFIX:-}xuxueli/xxl-job-admin:2.4.1
    container_name: xxl-job-admin
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PARAMS: >-
        --spring.datasource.url=jdbc:mysql://host.docker.internal:3306/xxl_job?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD:-1056398086}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  dlyk-mysql-data:
    name: dlyk-mysql-data
  dlyk-redis-data:
    name: dlyk-redis-data
  dlyk-rabbitmq-data:
    name: dlyk-rabbitmq-data
  dlyk-nginx-logs:
    name: dlyk-nginx-logs
