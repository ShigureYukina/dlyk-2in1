name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    # 被测系统的测试是 @SpringBootTest 级别：起的是完整上下文，必须连真实 MySQL 与 Redis。
    # 单元测试跑不起来的话，"20 线程并发转换只产生一条客户"这类一致性用例就永远只是本地跑过一次。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dlyk
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      elasticsearch:
        image: elasticsearch:8.11.4
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd="curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # dlyk.sql 里含建库后的全部表结构与基础字典数据，t_clue/t_customer 的 deleted 列
      # 也已在建表语句中，一次导入即可用于测试。
      - name: Import schema
        run: mysql -h 127.0.0.1 -uroot -proot --default-character-set=utf8mb4 dlyk < dlyk.sql

      - name: Test
        working-directory: dlyk-server
        env:
          # 连的是 service 容器，密码用 CI 专用值，覆盖 application.yml 里的本地配置
          SPRING_DATASOURCE_PASSWORD: root
          # JWT 密钥已外部化，仓库内无默认值，CI 用专用测试值
          JWT_SECRET: ci-only-test-secret-do-not-use-in-any-real-env
          # 关掉调度中心与 MQ：测试不依赖它们，开着只会让启动期反复重连
          XXL_JOB_ENABLED: "false"
          DLYK_MQ_ENABLED: "false"
          # 开启 ES 检索并放行真实 ES 集成测试（ClueEsSearchIntegrationTest 的门控变量）
          DLYK_ES_ENABLED: "true"
          DLYK_ES_IT: "true"
        run: mvn -B test

  # 应用镜像的构建与冒烟：本地无 Docker，这是镜像链路唯一真实验证路径。
  # 多阶段构建（Maven 层内嵌）→ 起依赖容器 → 跑容器 → 健康检查必须 UP。
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t dlyk-server:ci dlyk-server

      - name: Start dependency containers
        run: |
          docker network create ci-net
          docker run -d --name mysql --network ci-net \
            -e MYSQL_ROOT_PASSWORD=root -e MYSQL_DATABASE=dlyk -e TZ=Asia/Shanghai \
            mysql:8.0
          docker run -d --name redis --network ci-net redis:7.2-alpine
          docker run -d --name rabbitmq --network ci-net rabbitmq:3.13-management-alpine
          docker run -d --name elasticsearch --network ci-net \
            -e discovery.type=single-node -e xpack.security.enabled=false \
            -e ES_JAVA_OPTS="-Xms512m -Xmx512m" \
            elasticsearch:8.11.4
          for i in $(seq 1 30); do
            if docker exec mysql mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then break; fi
            sleep 2
          done
          docker exec -i mysql mysql -uroot -proot --default-character-set=utf8mb4 dlyk < dlyk.sql

      - name: Run container & smoke test
        run: |
          docker run -d --name dlyk-app --network ci-net -p 9090:9090 \
            -e MYSQL_HOST=mysql -e MYSQL_USERNAME=root -e MYSQL_PASSWORD=root \
            -e JWT_SECRET=ci-only-test-secret-do-not-use-in-any-real-env \
            -e REDIS_HOST=redis -e RABBITMQ_HOST=rabbitmq -e ES_URIS=http://elasticsearch:9200 \
            -e XXL_JOB_ENABLED=false -e DLYK_MQ_ENABLED=false \
            dlyk-server:ci
          for i in $(seq 1 60); do
            if curl -fs http://localhost:9090/actuator/health | grep -q '"status":"UP"'; then
              echo "container healthy"; exit 0
            fi
            sleep 3
          done
          echo "::error::container failed to become healthy"
          docker logs dlyk-app | tail -80
          exit 1
