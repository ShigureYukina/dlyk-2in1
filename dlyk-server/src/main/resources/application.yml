server:
  port: 8089
  servlet:
    context-path: /

#配置数据库连接相关信息
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dlyk?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    # 密钥一律走环境变量，仓库内不落默认值（历史提交中的旧密码已作废）
    password: ${MYSQL_PASSWORD:}
    hikari:
      #最大连接数，默认是10
      maximum-pool-size: 30
      #最小空闲连接，默认是10
      minimum-idle: 30
      #等待连接池分配连接的最大时长，超过该时长还没有可用连接则发生超时异常（单位毫秒）
      connection-timeout: 5000
      #空闲连接的最大时长，空闲多久就被释放回收，设置为0不让连接回收
      idle-timeout: 0
      #一个连接的最大生命时间，超过该时间还没有使用就回收掉（单位毫秒），最好不要超过8小时
      max-lifetime: 18000000


  #配置redis的连接信息
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password:

  # 配置 RabbitMQ 的连接信息
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # 消费失败自动重试，配合对账兜底避免消息处理异常直接丢数据
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  #设置jackson返回json数据时，时区和格式
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

  # 日志配置
  application:
    name: dlyk-server

#指定一下mapper.xml文件的位置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  # 去掉下面这一行即可关闭 SQL 日志
  # configuration:
  #   log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 配置日志级别和编码
logging:
  level:
    # 把 MyBatis 相关包的级别调到 WARN，控制台不再打印 SQL
    org.apache.ibatis: WARN
    org.mybatis: WARN
    com.dlyk: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  charset:
    console: UTF-8
    file: UTF-8

# ==================== 分布式任务调度（XXL-Job） ====================
# 原 Spring @Scheduled 定时任务已迁移至调度中心统一管理，
# 调度周期 / 失败重试 / 分片广播 / 执行日志 / 告警策略均在调度中心配置。
xxl:
  job:
    # 置为 false 可关闭执行器注册（本地不连调度中心时使用）
    enabled: ${XXL_JOB_ENABLED:true}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080/xxl-job-admin}
    accessToken: ${XXL_JOB_ACCESS_TOKEN:default_token}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:dlyk-server-executor}
      # 应用跑在宿主机、调度中心跑在容器时，需显式指定 address，
      # 否则执行器上报的是宿主机内网 IP，容器内的调度中心回调不到。
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ./logs/xxl-job
      logretentiondays: 7

# ==================== 高并发治理参数 ====================
dlyk:
  redisson:
    # Redisson 连接池大小，需覆盖并发抢锁的线程数
    pool-size: ${DLYK_REDISSON_POOL_SIZE:32}
    timeout-ms: ${DLYK_REDISSON_TIMEOUT_MS:3000}

  # 事件异步化开关：置为 false 时既不发布也不消费，
  # 用于本地只调接口、没起 RabbitMQ 的场景
  mq:
    enabled: ${DLYK_MQ_ENABLED:true}

  # 列表 total 缓存的旁路开关（见 com.dlyk.cache.ListTotalCache）。
  # 置为 false 时这层缓存整体不生效，用于压测时构造"没有它"的对照组；
  # 线上若出现总数长时间不准，也可以先把这个开关关掉止损。
  list-total-cache:
    enabled: ${LIST_TOTAL_CACHE_ENABLED:true}

# ==================== 可观测性 ====================
# 管理面独立端口：actuator 只在 9090 暴露，业务端口 8089 不再有任何管理端点，
# Prometheus 抓取配置见 deploy/prometheus/prometheus.yml
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name:dlyk-server}
    # 缓存命中率等指标需要开启统计
    enable:
      cache: true