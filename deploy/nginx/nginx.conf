# ============================================================
# DLyk CRM 反向代理
#
# 作用：
#   1. 统一入口，前端与后端同源，避免跨域配置散落在两端
#   2. 按客户端 IP 限流，保护后端应用不被突发流量打垮
#   3. 透传真实客户端 IP，否则应用侧日志里全是网关地址
#   4. 静态资源 gzip 压缩
#
# 注意：upstream 指向 compose 里的应用容器（dlyk-app），依赖栈与应用一键起。
#       应用跑在宿主机上的旧模式，把下一行改回 host.docker.internal:8089 即可。
# ============================================================

worker_processes auto;

events {
    worker_connections 10240;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 访问日志带上响应时间与上游耗时，便于区分"网关慢"还是"应用慢"
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip  on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types application/json text/plain application/javascript text/css application/xml;

    # 按客户端 IP 限流：稳态 200 r/s，突发允许 300 个排队后直接拒绝，
    # 避免请求在网关层堆积把应用线程池拖死
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
    limit_req_status 429;

    upstream dlyk_backend {
        server dlyk-app:8089;
        keepalive 64;
    }

    server {
        listen       80;
        server_name  _;

        # 健康检查（不经过后端）
        location = /health {
            access_log off;
            return 200 "ok\n";
        }

        # 业务接口
        location /api/ {
            limit_req zone=api_limit burst=300 nodelay;

            proxy_pass http://dlyk_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 3s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # 监控端点不经过网关对外暴露。
        #
        # 这里刻意不用 allow/deny 做 IP 白名单：容器化部署下客户端看到的
        # 是 Docker 网关地址（172.x），恰好落在内网网段里，白名单形同虚设。
        # 更可靠的做法是根本不代理 —— Prometheus 直接抓取应用端口，
        # 网关这一层保持对外只暴露业务接口。
        location /actuator/ {
            return 404;
        }
    }
}
